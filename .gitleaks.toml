title = "VArt gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Firebase web API keys публичны по дизайну (защита — в правилах Firestore, не в ключе)"
paths = [
  '''ourworld\.html$''',
  '''jobsil\.html$''',
]
regexTarget = "line"
regexes = [
  # ИЗВЕСТНЫЙ РИСК, принят владельцем: ключ FMP встроен в код намеренно (DEFAULT_API_KEY).
  # Он публичен в репозитории — лучше сменить ключ на fmp и убрать из кода; тогда удалить эту строку.
  '''DEFAULT_API_KEY\s*=''',
]
